name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test
