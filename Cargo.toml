[package]
name = "rust-libghostty-terminal"
version = "0.1.0"
edition = "2021"
description = "A native terminal with a reliable bearing"
license = "MIT OR Apache-2.0"

[package.metadata.packager]
product-name = "Ursa"
identifier = "com.crwgrant.ursa"
before-packaging-command = "cargo build --release"
icons = ["packaging/AppIcon.icns"]

[package.metadata.packager.macos]
minimum-system-version = "15.0"

[dependencies]
flume = "0.11"
gpui = "0.2.2"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
